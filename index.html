html,body{margin:0;height:100%;background:#0f1420;color:#e9ecf3;font:500 14px/1.45 "Segoe UI",system-ui,sans-serif}
#fcwrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
#fcbox{width:min(440px,100%);background:#171d2b;border:1px solid #2b3447;border-radius:14px;padding:22px;box-sizing:border-box;box-shadow:0 10px 40px #0008}
#fcbox h1{font-size:19px;margin:0 0 6px}#fcbox p{margin:0 0 14px;color:#a7b0c2}

#fcbox .d.on,#fcbox .d:hover{border-color:#fbbf24;color:#fff}

#fcbox a.b i{display:block;font-style:normal;font-size:12px;color:#7d879b;margin-top:2px}
#fcbox .q{margin:12px 0 0;font-size:12px}#fcbox .q a{color:#7d879b}
#fcbox .bar{height:8px;background:#2b3447;border-radius:4px;overflow:hidden}#fcbox .bar div{height:100%;width:0;background:#fbbf24;transition:width .2s}
#fcmsg{min-height:20px;margin-top:10px;color:#f87171}#fcmsg.ok{color:#4ade80}
#fcgame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
